# Production EOD ingest. Netlify scheduled functions on this OpenNext
# site register a badge and accept "Run now" but never invoke the handler
# (no logs, no DB writes). This workflow is the scheduler. See ADR 0006.
name: Scheduled ingest

on:
  # Deliberately off the hour. GitHub creates scheduled runs on a best-effort
  # basis and is worst at :00, when every hourly cron on the platform queues at
  # once — 11 runs measured on "0 22" landed a median 176 minutes late and one
  # 474 minutes late, with zero runner wait, so the delay was entirely in the
  # scheduler rather than in capacity. An odd minute sidesteps the peak.
  # Lateness is a freshness problem, not a correctness one: snapshots are keyed
  # on the cash session, so a run at 05:54 the next morning writes the same rows.
  schedule:
    # 03:07 UTC — 10:07 Bangkok, ~23:07 ET on the evening of the session being
    # closed out, which leaves Yahoo seven hours to publish the daily bar. It ran
    # at 18:37 ET before, and twice in September 2026 the vendor served a window
    # that stopped at the previous session, so a green run left the book a day
    # behind. Tue–Sat, because the run happens the calendar day after its session.
    - cron: "7 3 * * 2-6"
    # Second pass at 05:07 UTC (12:07 Bangkok), and only when the store still
    # does not reach the last completed session. See the bars-if-stale job.
    - cron: "7 5 * * 2-6"
    - cron: "37 8 * * 0" # Sunday fundamentals
  workflow_dispatch:
    inputs:
      job:
        description: Which ingest to run
        required: true
        type: choice
        options:
          - bars
          - bars-if-stale
          - fundamentals
        default: bars

concurrency:
  group: scheduled-ingest
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}

jobs:
  bars:
    name: Bars + snapshot
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'bars') ||
      (github.event_name == 'schedule' && github.event.schedule == '7 3 * * 2-6')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Set repository secret SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] && [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Set repository secret SUPABASE_URL or NEXT_PUBLIC_SUPABASE_URL."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @powerfund/worker ingest:bars -- --days=7 --pauseMs=400
      - run: pnpm --filter @powerfund/worker snapshot:portfolio
      # The book is a projection the transactions_apply trigger maintains, so it
      # can drift from the ledger without anything failing. This recomputes cash
      # and every quantity from `transactions` and compares, and also asks
      # whether the append-only guards are still armed -- because a reconciliation
      # alone cannot see a rewritten ledger, only a rewritten projection. It runs
      # after the snapshot so a mismatch is reported against the book the
      # briefing will quote, and it fails the run: silent drift is the failure
      # mode the whole ledger design exists to prevent.
      - name: Verify the book against the ledger
        run: pnpm --filter @powerfund/worker verify:book

  # A vendor that has not published yesterday's close yet is the one failure the
  # first pass cannot fix by succeeding. Rather than ingesting twice every
  # morning, ask the database whether the store reached the last completed cash
  # session and stop there when it did.
  bars-if-stale:
    name: Bars retry if stale
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'bars-if-stale') ||
      (github.event_name == 'schedule' && github.event.schedule == '7 5 * * 2-6')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Set repository secret SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] && [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Set repository secret SUPABASE_URL or NEXT_PUBLIC_SUPABASE_URL."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - id: freshness
        continue-on-error: true
        run: pnpm --filter @powerfund/worker bars:freshness
      - name: Decide whether to re-ingest
        id: gate
        env:
          STALE: ${{ steps.freshness.outputs.stale }}
        run: |
          # Only a checked "false" skips the work. An unset value means the check
          # itself failed, and re-ingesting is the safe reading of that.
          if [ "$STALE" = "false" ]; then
            echo "Bars already reach the last completed cash session; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        run: pnpm --filter @powerfund/worker ingest:bars -- --days=7 --pauseMs=400
      - if: steps.gate.outputs.run == 'true'
        run: pnpm --filter @powerfund/worker snapshot:portfolio
      - name: Verify the book against the ledger
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter @powerfund/worker verify:book
      # Still behind after a second pass means the vendor has published nothing,
      # or it is a US market holiday — which the weekday-only session clock
      # cannot tell apart. Record which, and fail neither run over it.
      - name: Report freshness after the retry
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: pnpm --filter @powerfund/worker bars:freshness

  fundamentals:
    name: Fundamentals
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'fundamentals') ||
      (github.event_name == 'schedule' && github.event.schedule == '37 8 * * 0')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Set repository secret SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] && [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Set repository secret SUPABASE_URL or NEXT_PUBLIC_SUPABASE_URL."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @powerfund/worker ingest:fundamentals -- --pauseMs=800
