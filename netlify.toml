# Power Fund — deploy the research frontend from this monorepo.
# Netlify auto-provisions the Next.js runtime (OpenNext); do not pin @netlify/plugin-nextjs
# unless you intentionally want to freeze the adapter version.

[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @powerfund/web build"
  publish = "apps/web/.next"
  functions = "netlify/functions"
  # Skip deploys that do not touch the web app, shared packages, or scheduled ingest.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web apps/worker packages/domain packages/db packages/data-clients netlify package.json pnpm-lock.yaml pnpm-workspace.yaml netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # Netlify uses the packageManager field in package.json (pnpm@9.1.1).

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Scheduled trigger only kicks ingest-bars-background (30s cap).
# The `-background` suffix gives the heavy ingest a 15-minute budget.
[functions."scheduled-ingest-bars"]
  timeout = 26

# Nightly NAV snapshot, 30 min after the bars ingest so closes are fresh.
# Fast enough to run inline in the scheduled budget.
[functions."scheduled-snapshot-portfolio"]
  timeout = 26

[dev]
  command = "pnpm --filter @powerfund/web dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false

# Set in the Netlify UI (or CLI) for the site:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
# Private (never NEXT_PUBLIC_*) for scheduled ingest:
#   SUPABASE_SERVICE_ROLE_KEY
#   CRON_SECRET
#   TIINGO_API_KEY (optional)
