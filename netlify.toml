# Power Fund — deploy the research frontend from this monorepo.
# Netlify auto-provisions the Next.js runtime (OpenNext); do not pin @netlify/plugin-nextjs
# unless you intentionally want to freeze the adapter version.

[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @powerfund/web build"
  publish = "apps/web/.next"
  functions = "netlify/functions"
  # Skip deploys that do not touch the web app, shared packages, optional
  # HTTP ingest functions, or docs (Mandate is rendered from docs/mandate.md).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web apps/worker packages/domain packages/db packages/data-clients netlify docs package.json pnpm-lock.yaml pnpm-workspace.yaml netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # Netlify uses the packageManager field in package.json (pnpm@9.1.1).

[functions]
  directory = "netlify/functions"
  # Production cron is GitHub Actions (ADR 0006). OpenNext on this site
  # registers scheduled functions but never invokes them. Background
  # jobs that import the worker still need esbuild for optional HTTP kicks.

[functions."ingest-bars-background"]
  node_bundler = "esbuild"

[functions."ingest-fundamentals-background"]
  node_bundler = "esbuild"

[dev]
  command = "pnpm --filter @powerfund/web dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false

# Set in the Netlify UI (or CLI) for the site:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
# Private (never NEXT_PUBLIC_*) if you HTTP-kick ingest-*-background:
#   SUPABASE_SERVICE_ROLE_KEY
#   CRON_SECRET
#   TIINGO_API_KEY (optional)
# Production cron secrets live on GitHub Actions, not here.
