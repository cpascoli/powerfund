# Power Fund — deploy the research frontend from this monorepo.
# Netlify auto-provisions the Next.js runtime (OpenNext); do not pin @netlify/plugin-nextjs
# unless you intentionally want to freeze the adapter version.

[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @powerfund/web build"
  publish = "apps/web/.next"
  functions = "netlify/functions"
  # Skip deploys that do not touch the web app, shared packages, scheduled
  # ingest, or docs (the Mandate page is rendered from docs/mandate.md at build).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web apps/worker packages/domain packages/db packages/data-clients netlify docs package.json pnpm-lock.yaml pnpm-workspace.yaml netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # Netlify uses the packageManager field in package.json (pnpm@9.1.1).

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cron lives in netlify.toml so Next.js/OpenNext deploys cannot drop the
# inline `export const config.schedule`. Scheduled functions are 26s;
# heavy work is ingest-*-background (15-minute budget).
[functions."scheduled-ingest-bars"]
  schedule = "0 22 * * 1-5"
  timeout = 26

[functions."scheduled-ingest-fundamentals"]
  schedule = "0 8 * * 0"
  timeout = 26

# Backup NAV mark if the bars background job dies before snapshotting.
# The 22:00 bars background also writes tonight's snapshot after ingest.
[functions."scheduled-snapshot-portfolio"]
  schedule = "30 22 * * 1-5"
  timeout = 26

# Temporary probe that Netlify actually invokes scheduled functions.
[functions."scheduled-heartbeat"]
  schedule = "0 * * * *"
  timeout = 26

[dev]
  command = "pnpm --filter @powerfund/web dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false

# Set in the Netlify UI (or CLI) for the site:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
# Private (never NEXT_PUBLIC_*) for scheduled ingest:
#   SUPABASE_SERVICE_ROLE_KEY
#   CRON_SECRET
#   TIINGO_API_KEY (optional)
